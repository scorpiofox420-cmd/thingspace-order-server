server:
  # SERVER_PORT/PORT are injected by hosting platforms like Render.
  port: ${SERVER_PORT:${PORT:10000}}

spring:
  datasource:
    # DB_PARAMS lets you append JDBC options, e.g. "?sslmode=require" on Render.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:thingspace_orders}${DB_PARAMS:}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # "update" auto-creates/updates tables — fine for dev, switch to a real
      # migration tool (Flyway/Liquibase) before production.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

thingspace:
  oauth-client-id: ${THINGSPACE_OAUTH_CLIENT_ID:}
  oauth-client-secret: ${THINGSPACE_OAUTH_CLIENT_SECRET:}
  vz-m2m-token: ${THINGSPACE_VZ_M2M_TOKEN:}
  uws-username: ${THINGSPACE_UWS_USERNAME:}   # optional: auto-generates the VZ-M2M session token
  uws-password: ${THINGSPACE_UWS_PASSWORD:}
  account-name: ${THINGSPACE_ACCOUNT_NAME:}
  request-ids: ${THINGSPACE_REQUEST_IDS:}   # comma-separated list of open order/request UUIDs to poll
  environment: ${THINGSPACE_ENVIRONMENT:PRODUCTION}
  poll-interval-ms: ${THINGSPACE_POLL_INTERVAL_MS:300000}
  oauth-clock-skew: ${THINGSPACE_OAUTH_CLOCK_SKEW:60}   # seconds applied when checking token expiry
  # Optional base-URL overrides (defaults are production/mock ThingSpace URLs)
  base-url: ${THINGSPACE_BASE_URL:}
  credential-base-url: ${THINGSPACE_CREDENTIAL_BASE_URL:}

cors:
  # Comma-separated origins allowed to call the API from the browser.
  # Default * works for a personal dashboard (Vercel) — tighten for production.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:*}

logging:
  level:
    com.verizon.thingspace.server: INFO

---
# Local in-memory DB profile — activate with SPRING_PROFILES_ACTIVE=h2
# Usage:  java -jar ... --spring.profiles.active=h2
# No Postgres or .env needed; device orders + customer are seeded on startup.
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:thingspace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
