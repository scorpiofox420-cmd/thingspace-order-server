package com.verizon.thingspace.server;

import java.time.LocalDate;

public class OrderRequest {

    // Account & Profile Information
    private String profileId;
    private String profileName;
    private String accountNumber;
    private String accountName;
    
    // User Details
    private String userFirstName;
    private String userLastName;
    private String costCenter;
    private String userId;
    private String emailAddress;
    
    // Device Hardware & Network Identifiers
    private String wirelessNumber; // MDN
    private String imei;           // Device IMEI
    private String iccid;          // SIM Card ICCID
    private String deviceType;     
    
    // Purchase Order Details
    private String workOrderNumber; // PO Number / Order ID
    private String customerPoNumber;
    private LocalDate purchaseOrderEffectiveDate;
    private LocalDate purchaseOrderExpirationDate;
    private String purchaseOrderTypeCode;
    private String purchaseOrderPaymentStatus;
    private String purchaseOrderStatus;
    
    // Invoice Details
    private LocalDate invoiceDate;
    private String invoiceNumber;

    // --- Getters and Setters ---
    public String getProfileId() { return profileId; }
    public void setProfileId(String profileId) { this.profileId = profileId; }

    public String getProfileName() { return profileName; }
    public void setProfileName(String profileName) { this.profileName = profileName; }

    public String getAccountNumber() { return accountNumber; }
    public void setAccountNumber(String accountNumber) { this.accountNumber = accountNumber; }

    public String getAccountName() { return accountName; }
    public void setAccountName(String accountName) { this.accountName = accountName; }

    public String getUserFirstName() { return userFirstName; }
    public void setUserFirstName(String userFirstName) { this.userFirstName = userFirstName; }

    public String getUserLastName() { return userLastName; }
    public void setUserLastName(String userLastName) { this.userLastName = userLastName; }

    public String getCostCenter() { return costCenter; }
    public void setCostCenter(String costCenter) { this.costCenter = costCenter; }

    public String getUserId() { return userId; }
    public void setUserId(String userId) { this.userId = userId; }

    public String getEmailAddress() { return emailAddress; }
    public void setEmailAddress(String emailAddress) { this.emailAddress = emailAddress; }

    public String getWirelessNumber() { return wirelessNumber; }
    public void setWirelessNumber(String wirelessNumber) { this.wirelessNumber = wirelessNumber; }

    public String getImei() { return imei; }
    public void setImei(String imei) { this.imei = imei; }

    public String getIccid() { return iccid; }
    public void setIccid(String iccid) { this.iccid = iccid; }

    public String getDeviceType() { return deviceType; }
    public void setDeviceType(String deviceType) { this.deviceType = deviceType; }

    public String getWorkOrderNumber() { return workOrderNumber; }
    public void setWorkOrderNumber(String workOrderNumber) { this.workOrderNumber = workOrderNumber; }

    public String getCustomerPoNumber() { return customerPoNumber; }
    public void setCustomerPoNumber(String customerPoNumber) { this.customerPoNumber = customerPoNumber; }

    public LocalDate getPurchaseOrderEffectiveDate() { return purchaseOrderEffectiveDate; }
    public void setPurchaseOrderEffectiveDate(LocalDate purchaseOrderEffectiveDate) { this.purchaseOrderEffectiveDate = purchaseOrderEffectiveDate; }

    public LocalDate getPurchaseOrderExpirationDate() { return purchaseOrderExpirationDate; }
    public void setPurchaseOrderExpirationDate(LocalDate purchaseOrderExpirationDate) { this.purchaseOrderExpirationDate = purchaseOrderExpirationDate; }

    public String getPurchaseOrderTypeCode() { return purchaseOrderTypeCode; }
    public void setPurchaseOrderTypeCode(String purchaseOrderTypeCode) { this.purchaseOrderTypeCode = purchaseOrderTypeCode; }

    public String getPurchaseOrderPaymentStatus() { return purchaseOrderPaymentStatus; }
    public void setPurchaseOrderPaymentStatus(String purchaseOrderPaymentStatus) { this.purchaseOrderPaymentStatus = purchaseOrderPaymentStatus; }

    public String getPurchaseOrderStatus() { return purchaseOrderStatus; }
    public void setPurchaseOrderStatus(String purchaseOrderStatus) { this.purchaseOrderStatus = purchaseOrderStatus; }

    public LocalDate getInvoiceDate() { return invoiceDate; }
    public void setInvoiceDate(LocalDate invoiceDate) { this.invoiceDate = invoiceDate; }

    public String getInvoiceNumber() { return invoiceNumber; }
    public void setInvoiceNumber(String invoiceNumber) { this.invoiceNumber = invoiceNumber; }
}
