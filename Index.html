<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acode Script Demo</title>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #3b82f6;
            --danger: #ef4444;
            --border: #333333;
        }

        body.light-theme {
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #111827;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1rem;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.25rem;
        }

        button {
            cursor: pointer;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-secondary {
            background-color: var(--border);
            color: var(--text);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            outline: none;
        }

        ul {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        li {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
        }

        .console-box {
            background: #000;
            color: #00ff00;
            font-family: monospace;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            height: 100px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Acode Task Manager</h1>
            <button class="btn-secondary" id="themeToggle">Toggle Theme</button>
        </header>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button class="btn-primary" id="addTaskBtn">Add</button>
        </div>

        <ul id="taskList"></ul>

        <h3>Console Logs:</h3>
        <div class="console-box" id="consoleOutput"></div>
    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        const themeToggle = document.getElementById('themeToggle');
        const consoleOutput = document.getElementById('consoleOutput');

        // State
        let tasks = JSON.parse(localStorage.getItem('acode_tasks')) || [];

        // Custom Logging Utility for Web View
        function logToScreen(message) {
            console.log(message);
            const entry = document.createElement('div');
            entry.textContent = `> ${message}`;
            consoleOutput.appendChild(entry);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // Render Tasks
        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${task}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
                `;
                taskList.appendChild(li);
            });
            localStorage.setItem('acode_tasks', JSON.stringify(tasks));
        }

        // Add Task
        function addTask() {
            const val = taskInput.value.trim();
            if (!val) {
                logToScreen('Warning: Input field is empty.');
                return;
            }
            tasks.push(val);
            taskInput.value = '';
            renderTasks();
            logToScreen(`Task added: "${val}"`);
        }

        // Delete Task
        window.deleteTask = function(index) {
            const removed = tasks.splice(index, 1);
            renderTasks();
            logToScreen(`Task removed: "${removed[0]}"`);
        };

        // Theme Switcher
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            logToScreen(`Switched to ${isLight ? 'Light' : 'Dark'} mode.`);
        });

        // Event Listeners
        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Init
        logToScreen('Script initialized in Acode.');
        renderTasks();
    </script>
</body>
</html>
