# Render Blueprint — deploys the ThingSpace Order Server as a free,
# database-less Docker web service using file-backed H2 persistence.

version: "1"

services:
  - type: web
    name: thingspace-order-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/orders
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: SERVER_PORT
        value: "10000"
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: CORS_ALLOWED_METHODS
        value: "*"
      - key: THINGSPACE_ENVIRONMENT
        value: PRODUCTION
      - key: THINGSPACE_POLL_INTERVAL_MS
        value: "300000"
      # --- Required Credentials ---
      - key: THINGSPACE_OAUTH_CLIENT_ID
        value: ac1271c5-ef51-4299-82aa-479bb5afd6c3
      - key: THINGSPACE_OAUTH_CLIENT_SECRET
        value: fromEnv
      - key: THINGSPACE_VZ_M2M_TOKEN
        value: M2U0NTE0NzMtYWMyZC00M2JhLWFiNGEtMTUyMDM5ZDc0NmIw
      - key: THINGSPACE_UWS_USERNAME
        value: fromEnv
      - key: THINGSPACE_UWS_PASSWORD
        value: fromEnv
      # --- Account & Endpoints ---
      - key: THINGSPACE_ACCOUNT_NAME
        value: "742899750-00001"
      - key: THINGSPACE_BASE_URL
        value: https://thingspace.verizon.com/api
      - key: THINGSPACE_CREDENTIAL_BASE_URL
        value: https://thingspace.verizon.com/api/hyper-precise/v1
      # --- Optional / Dynamic Poll Keys ---
      - key: THINGSPACE_REQUEST_IDS
        value: fromEnv
      - key: THINGSPACE_DEVICE_ICCID
        value: fromEnv
      - key: THINGSPACE_DEVICE_IMEI
        value: fromEnv
      - key: THINGSPACE_DEVICE_MDN
        value: fromEnv
