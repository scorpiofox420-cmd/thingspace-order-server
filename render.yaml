# Render Blueprint — deploys the ThingSpace Order Server as a free,
# database-less Docker web service. Order status is persisted in H2
# (file-backed, THINGSPACE profile h2), so we avoid Render's Postgres
# (free Postgres plans are retired — a `databases:` block with plan free
# is exactly what the validator rejects with "something is wrong with the
# script"). The app has no hard DB dependency.

# Usage:
#   1. Push this repo to GitHub (branch = master).
#   2. render.com -> New + -> Blueprint -> select or paste the repo URL.
#   3. Fill in the four `fromEnv` secrets it asks for (client id/secret,
#      UWS username/password), then Apply. Render builds the web service.
#   4. After deploy, register the callback URL with ThingSpace:
#      https://<your-app>.onrender.com/api/callbacks/device-service

version: '1'

services:
  - type: web
    name: thingspace-order-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/orders
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: SERVER_PORT
        value: '10000'
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: CORS_ALLOWED_METHODS
        value: '*'
      - key: THINGSPACE_ENVIRONMENT
        value: PRODUCTION
      - key: THINGSPACE_POLL_INTERVAL_MS
        value: '300000'
      # --- Required: must be provided at Blueprint creation ---
      - key: THINGSPACE_OAUTH_CLIENT_ID
        value: your_client_id_here
      - key: THINGSPACE_OAUTH_CLIENT_SECRET
        value: fromEnv
      - key: THINGSPACE_UWS_USERNAME
        value: fromEnv
      - key: THINGSPACE_UWS_PASSWORD
        value: fromEnv
      - key: THINGSPACE_VZ_M2M_TOKEN
        value: your_vz_m2m_token_here
      # --- Optional: set in the Render dashboard after deploy ---
      - key: THINGSPACE_ACCOUNT_NAME
        value: 742899750-00001
      - key: THINGSPACE_BASE_URL
        value: https://thingspace.verizon.com
      - key: THINGSPACE_CREDENTIAL_BASE_URL
        sync: false
      - key: THINGSPACE_REQUEST_IDS
        value: fromEnv
      - key: THINGSPACE_DEVICE_ICCID
        value: fromEnv
      - key: THINGSPACE_DEVICE_IMEI
        value: fromEnv
      - key: THINGSPACE_DEVICE_MDN
        value: fromEnv