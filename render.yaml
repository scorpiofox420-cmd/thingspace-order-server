# Render Blueprint — deploys the web service + a managed Postgres database.
#
# How to use:
#   1. Push this repo to GitHub (see README "Deploy" notes).
#   2. On render.com, click "New +" -> "Blueprint" and select the repo.
#   3. Fill in any "fromEnv" secrets it asks for (envVar groups below),
#      then apply. Render creates the Postgres DB and the web service.
#
# After deploying, register the callback URL with ThingSpace so async
# callbacks actually arrive:
#   https://<your-app>.onrender.com/api/callbacks/device-service
#
# secrets are managed by Render "Environment" / env var groups — set the
# ThingSpace credential keys there (Blueprints will prompt you for fromEnv
# vars if you list them with value.fromEnv).

databases:
  - name: thingspace-orders-db
    plan: free
    databaseName: thingspace_orders
    user: thingspace

services:
  - type: web
    name: thingspace-order-server
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/orders
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: thingspace-orders-db
          property: hostname
      - key: DB_PORT
        fromDatabase:
          name: thingspace-orders-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: thingspace-orders-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: thingspace-orders-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: thingspace-orders-db
          property: password
      - key: DB_PARAMS
        value: "?sslmode=require"
      - key: THINGSPACE_OAUTH_CLIENT_ID
        value: fromEnv
      - key: THINGSPACE_OAUTH_CLIENT_SECRET
        value: fromEnv
      - key: THINGSPACE_VZ_M2M_TOKEN
        value: fromEnv
      - key: THINGSPACE_ACCOUNT_NAME
        value: fromEnv
      - key: THINGSPACE_REQUEST_IDS
        value: fromEnv
      - key: THINGSPACE_ENVIRONMENT
        value: PRODUCTION
      - key: THINGSPACE_POLL_INTERVAL_MS
        value: "300000"
      - key: CORS_ALLOWED_ORIGINS
        value: fromEnv
      - key: CORS_ALLOWED_METHODS
        value: "*"